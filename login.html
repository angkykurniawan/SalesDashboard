<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sales Dashboard</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Default users data -->
  <script src="users.js"></script>

  <!-- Auth logic -->
  <script src="auth.js" defer></script>

  <style>
    body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }

    /* Animated gradient background */
    .login-bg {
      background: linear-gradient(135deg, #1e3a5f 0%, #1e40af 40%, #4f46e5 100%);
      min-height: 100vh;
    }

    /* Card entrance animation */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-card {
      animation: slideUp 0.4s ease both;
    }

    /* Input focus ring */
    .auth-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.18);
    }

    /* Tab active state */
    .tab-btn.active {
      color: #1d4ed8;
      border-bottom: 2px solid #3b82f6;
      font-weight: 600;
    }

    /* Shake animation for wrong password */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }
    .shake { animation: shake 0.35s ease; }

    /* Password visibility toggle */
    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; color: #9ca3af;
      background: none; border: none; padding: 0;
      line-height: 1;
    }
    .pw-toggle:hover { color: #6b7280; }
  </style>
</head>
<body class="login-bg flex items-center justify-center px-4 py-10">

  <div class="login-card w-full max-w-md">

    <!-- Logo / Brand -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/10 backdrop-blur mb-3">
        <span class="text-3xl">📊</span>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Sales Dashboard</h1>
      <p class="text-blue-200 text-sm mt-1">Sign in to access your analytics</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Tab Navigation -->
      <div class="flex border-b border-gray-100" id="tab-nav" role="tablist">
        <button
          id="tab-login"
          class="tab-btn active flex-1 py-4 text-sm text-gray-500 transition-colors"
          role="tab" aria-selected="true" aria-controls="panel-login"
        >Sign In</button>
        <button
          id="tab-register"
          class="tab-btn flex-1 py-4 text-sm text-gray-500 transition-colors"
          role="tab" aria-selected="false" aria-controls="panel-register"
        >Add New User</button>
      </div>

      <!-- ===== LOGIN PANEL ===== -->
      <div id="panel-login" role="tabpanel">
        <form id="form-login" class="p-6 sm:p-8 space-y-5" novalidate>

          <!-- Alert -->
          <div id="login-alert" class="hidden rounded-lg px-4 py-3 text-sm font-medium" role="alert"></div>

          <!-- Username -->
          <div>
            <label for="login-username" class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Username</label>
            <input
              type="text" id="login-username" name="username"
              autocomplete="username" spellcheck="false"
              placeholder="Enter your username"
              class="auth-input w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm text-gray-800 transition"
              required
            />
          </div>

          <!-- Password -->
          <div>
            <label for="login-password" class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Password</label>
            <div class="pw-wrap">
              <input
                type="password" id="login-password" name="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                class="auth-input w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5 pr-10 text-sm text-gray-800 transition"
                required
              />
              <button type="button" class="pw-toggle" data-target="login-password" title="Show/hide password">👁</button>
            </div>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm py-2.5 rounded-lg transition-colors"
          >Sign In</button>

        </form>
      </div>

      <!-- ===== REGISTER PANEL ===== -->
      <div id="panel-register" class="hidden" role="tabpanel">
        <form id="form-register" class="p-6 sm:p-8 space-y-5" novalidate>

          <!-- Info banner: must be logged in -->
          <div id="register-auth-guard" class="hidden rounded-lg bg-amber-50 border border-amber-200 px-4 py-3 text-sm text-amber-700 font-medium">
            ⚠️ You must be <strong>logged in</strong> to add a new user.
            <a href="#" class="underline ml-1">Sign in first →</a>
          </div>

          <!-- Alert -->
          <div id="register-alert" class="hidden rounded-lg px-4 py-3 text-sm font-medium" role="alert"></div>

          <!-- New Username -->
          <div>
            <label for="reg-username" class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">New Username</label>
            <input
              type="text" id="reg-username" name="reg-username"
              autocomplete="off" spellcheck="false"
              placeholder="Choose a username"
              class="auth-input w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm text-gray-800 transition"
            />
          </div>

          <!-- New Password -->
          <div>
            <label for="reg-password" class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Password</label>
            <div class="pw-wrap">
              <input
                type="password" id="reg-password" name="reg-password"
                autocomplete="new-password"
                placeholder="Min. 6 characters"
                class="auth-input w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5 pr-10 text-sm text-gray-800 transition"
              />
              <button type="button" class="pw-toggle" data-target="reg-password" title="Show/hide password">👁</button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div>
            <label for="reg-confirm" class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Confirm Password</label>
            <div class="pw-wrap">
              <input
                type="password" id="reg-confirm" name="reg-confirm"
                autocomplete="new-password"
                placeholder="Re-enter your password"
                class="auth-input w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-2.5 pr-10 text-sm text-gray-800 transition"
              />
              <button type="button" class="pw-toggle" data-target="reg-confirm" title="Show/hide password">👁</button>
            </div>
          </div>

          <!-- Submit -->
          <button
            type="submit" id="btn-register"
            class="w-full bg-violet-600 hover:bg-violet-700 active:bg-violet-800 text-white font-semibold text-sm py-2.5 rounded-lg transition-colors"
          >Add User</button>

        </form>
      </div>

      <!-- Registered users list (visible only when logged in) -->
      <div id="users-list-wrap" class="hidden px-6 sm:px-8 pb-6">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Registered Users</p>
        <ul id="users-list" class="space-y-1 text-sm text-gray-700 max-h-36 overflow-y-auto pr-1"></ul>
      </div>

    </div>

    <!-- Footer -->
    <p class="text-center text-blue-200/60 text-xs mt-6">Sales Dashboard &copy; 2023</p>
  </div>

</body>
</html>
